[build-system]
requires = ["setuptools >= 77.0.3", "setuptools-scm >= 8"]
build-backend = "setuptools.build_meta"

[project]
name = "py-assettocorsa"
dynamic = ["version"]
description = "Read Assetto Corsa shared memory on Windows."
readme = "README.MD"
requires-python = ">= 3.3"
dependencies = ["enum34 == 1.1.10; python_version < '3.4'"]
classifiers = ["Operating System :: Microsoft :: Windows"]

[dependency-groups]
dev = ["build", "twine"]

[tool.setuptools.packages.find]
include = ["ac*"]

[tool.setuptools_scm]

[project.urls]
Homepage = "https://github.com/ooocheckitout/py-assettocorsa"
Repository = "https://github.com/ooocheckitout/py-assettocorsa.git"
Issues = "https://github.com/ooocheckitout/py-assettocorsa/issues"
